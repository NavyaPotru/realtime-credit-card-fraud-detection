name: Validate Databricks Notebooks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: pip install nbformat

      - name: Validate notebook structure and syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          required = {
              "01_realtime_bronze_ingestion.ipynb",
              "02_realtime_validation.ipynb",
              "03_realtime_enrichment_scoring.ipynb",
              "04_fraud_case_processing.ipynb",
              "05_monitoring_reconciliation.ipynb",
          }

          notebook_dir = Path("notebooks")
          existing = {path.name for path in notebook_dir.glob("*.ipynb")}

          missing = required - existing
          if missing:
              raise SystemExit(
                  f"Missing required notebooks: {sorted(missing)}"
              )

          for path in sorted(notebook_dir.glob("*.ipynb")):
              notebook = nbformat.read(path, as_version=4)

              if not notebook.cells:
                  raise SystemExit(f"{path} is empty")

              for index, cell in enumerate(notebook.cells, start=1):
                  if cell.cell_type != "code":
                      continue

                  source = cell.source.strip()

                  # Databricks SQL and magic cells are not Python.
                  if not source or source.startswith("%"):
                      continue

                  try:
                      compile(source, str(path), "exec")
                  except SyntaxError as error:
                      raise SystemExit(
                          f"Python syntax error in {path}, "
                          f"cell {index}: {error}"
                      )

              print(f"Validated: {path}")

          print("All Databricks notebooks passed validation")
          PY
