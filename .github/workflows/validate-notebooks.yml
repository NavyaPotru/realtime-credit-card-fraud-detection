name: Validate Databricks Notebooks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: pip install nbformat

      - name: Validate notebook structure and syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          required_stems = {
              "01_realtime_bronze_ingestion",
              "02_realtime_validation",
              "03_realtime_enrichment_scoring",
              "04_fraud_case_processing",
              "05_monitoring_reconciliation",
          }

          supported_extensions = {".ipynb", ".py", ".sql"}

          notebook_files = [
              path
              for path in Path(".").rglob("*")
              if path.is_file()
              and path.suffix.lower() in supported_extensions
              and ".git" not in path.parts
          ]

          discovered = {
              path.stem: path
              for path in notebook_files
          }

          missing = required_stems - discovered.keys()

          print("Discovered notebook files:")
          for path in sorted(notebook_files):
              print(f"  {path}")

          if missing:
              raise SystemExit(
                  f"Missing required notebooks: {sorted(missing)}"
              )

          for notebook_name in sorted(required_stems):
              path = discovered[notebook_name]

              if path.suffix == ".ipynb":
                  notebook = nbformat.read(path, as_version=4)

                  if not notebook.cells:
                      raise SystemExit(f"{path} is empty")

                  for index, cell in enumerate(
                      notebook.cells,
                      start=1
                  ):
                      if cell.cell_type != "code":
                          continue

                      source = cell.source.strip()

                      if not source or source.startswith("%"):
                          continue

                      try:
                          compile(source, str(path), "exec")
                      except SyntaxError as error:
                          raise SystemExit(
                              f"Python syntax error in {path}, "
                              f"cell {index}: {error}"
                          )

              elif path.suffix == ".py":
                  source = path.read_text(encoding="utf-8")
                  compile(source, str(path), "exec")

              elif path.suffix == ".sql":
                  if not path.read_text(encoding="utf-8").strip():
                      raise SystemExit(f"{path} is empty")

              print(f"Validated: {path}")

          print("All Databricks notebooks passed validation")
          PY
